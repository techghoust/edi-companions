name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: verify and package JetBrains plugin
        working-directory: jetbrains-plugin
        run: gradle verifyPlugin buildPlugin
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/edi-vscode-0.3.0.vsix
          jetbrains-plugin/build/distributions/*.zip
          --generate-notes
          --latest
          --title "EDI Developer Journal Companion ${{ github.ref_name }}"
